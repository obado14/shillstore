<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlowVarsityHover" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#7f1d1d" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0304" stop-opacity="1" />
    </radialGradient>
    <filter id="redNeonGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlowVarsityHover)" />

  <!-- Outer Neon Border -->
  <rect x="40" y="40" width="720" height="720" rx="36" fill="none" stroke="#f87171" stroke-width="2.5" filter="url(#redNeonGlow)" stroke-opacity="0.8" />

  <!-- Central Card Container -->
  <rect x="130" y="180" width="540" height="440" rx="28" fill="#1c0b0e" stroke="#f87171" stroke-width="2" filter="drop-shadow(0 25px 35px rgba(220,38,38,0.35))" />

  <!-- Top Badge -->
  <g transform="translate(400, 228)">
    <rect x="-120" y="-16" width="240" height="32" rx="16" fill="#f87171" />
    <text x="0" y="5" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#1c0b0e" text-anchor="middle" letter-spacing="3">EXCLUSIVE PREVIEW</text>
  </g>

  <!-- Stylized Varsity Jacket Wireframe Icon (Illuminated) -->
  <g transform="translate(400, 325) scale(1.2)" filter="url(#redNeonGlow)">
    <path d="M-22,-44 C-22,-54 22,-54 22,-44 L16,-38 C16,-46 -16,-46 -16,-38 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2.5" />
    <path d="M-16,-38 L-55,-24 L-75,28 L-52,36 L-42,-4 L-42,45 L42,45 L42,-4 L52,36 L75,28 L55,-24 L16,-38" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <path d="M-16,-38 L-42,-4 M16,-38 L42,-4" stroke="#f87171" stroke-width="3" />
    <line x1="0" y1="-38" x2="0" y2="42" stroke="#ffffff" stroke-width="2.5" />
    <text x="-22" y="2" font-family="'Georgia', serif" font-size="20" font-weight="900" fill="#f87171" text-anchor="middle">S</text>
  </g>

  <!-- Coming Soon Headline -->
  <text x="400" y="445" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">COMING SOON</text>

  <!-- Price & Status -->
  <text x="400" y="490" font-family="'Montserrat', sans-serif" font-size="24" font-weight="900" fill="#f87171" text-anchor="middle">Rp 499.000</text>
  <text x="400" y="525" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">VARSITY JACKET SERIES</text>

  <!-- Pre-order button mockup -->
  <g transform="translate(400, 570)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#f87171" filter="url(#redNeonGlow)" />
    <text x="0" y="5" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#1c0b0e" text-anchor="middle" letter-spacing="2">SIAPKAN WISHLIST</text>
  </g>
</svg>
