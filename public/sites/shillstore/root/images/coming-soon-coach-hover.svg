<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlowCoachHover" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a0805" stop-opacity="1" />
    </radialGradient>
    <filter id="amberNeonGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlowCoachHover)" />

  <!-- Outer Neon Border -->
  <rect x="40" y="40" width="720" height="720" rx="36" fill="none" stroke="#fbbf24" stroke-width="2.5" filter="url(#amberNeonGlow)" stroke-opacity="0.8" />

  <!-- Central Card Container -->
  <rect x="130" y="180" width="540" height="440" rx="28" fill="#1c1917" stroke="#fbbf24" stroke-width="2" filter="drop-shadow(0 25px 35px rgba(245,158,11,0.35))" />

  <!-- Top Badge -->
  <g transform="translate(400, 228)">
    <rect x="-120" y="-16" width="240" height="32" rx="16" fill="#fbbf24" />
    <text x="0" y="5" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#1c1917" text-anchor="middle" letter-spacing="3">EXCLUSIVE PREVIEW</text>
  </g>

  <!-- Stylized Coach Jacket Wireframe Icon (Illuminated) -->
  <g transform="translate(400, 325) scale(1.2)" filter="url(#amberNeonGlow)">
    <path d="M-28,-40 L0,-24 L28,-40 L16,-48 L-16,-48 Z" fill="#fbbf24" fill-opacity="0.4" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round" />
    <path d="M-28,-40 L-58,-25 L-76,30 L-50,38 L-42,-5 L-42,45 L42,45 L42,-5 L50,38 L76,30 L58,-25 L28,-40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <line x1="0" y1="-24" x2="0" y2="45" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="0" cy="-14" r="4" fill="#fbbf24" />
    <circle cx="0" cy="2" r="4" fill="#fbbf24" />
    <circle cx="0" cy="18" r="4" fill="#fbbf24" />
    <circle cx="0" cy="34" r="4" fill="#fbbf24" />
  </g>

  <!-- Coming Soon Headline -->
  <text x="400" y="445" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">COMING SOON</text>

  <!-- Price & Status -->
  <text x="400" y="490" font-family="'Montserrat', sans-serif" font-size="24" font-weight="900" fill="#fbbf24" text-anchor="middle">Rp 299.000</text>
  <text x="400" y="525" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">COACH JACKET SERIES</text>

  <!-- Pre-order button mockup -->
  <g transform="translate(400, 570)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#fbbf24" filter="url(#amberNeonGlow)" />
    <text x="0" y="5" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#1c1917" text-anchor="middle" letter-spacing="2">SIAPKAN WISHLIST</text>
  </g>
</svg>
