<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlowHover" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#075985" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlowHover)" />

  <!-- Outer Neon Border -->
  <rect x="40" y="40" width="720" height="720" rx="36" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)" stroke-opacity="0.8" />

  <!-- Central Card Container -->
  <rect x="130" y="180" width="540" height="440" rx="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="drop-shadow(0 25px 35px rgba(2,132,199,0.35))" />

  <!-- Top Badge -->
  <g transform="translate(400, 228)">
    <rect x="-120" y="-16" width="240" height="32" rx="16" fill="#38bdf8" />
    <text x="0" y="5" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#040810" text-anchor="middle" letter-spacing="3">EXCLUSIVE PREVIEW</text>
  </g>

  <!-- Stylized Jacket Wireframe Icon (Illuminated) -->
  <g transform="translate(400, 325) scale(1.2)" filter="url(#neonGlow)">
    <path d="M-22,-45 C-22,-65 22,-65 22,-45 C15,-40 -15,-40 -22,-45 Z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />
    <path d="M-22,-45 L-55,-25 L-75,30 L-50,38 L-42,-5 L-42,45 L42,45 L42,-5 L50,38 L75,30 L55,-25 L22,-45" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <line x1="0" y1="-42" x2="0" y2="45" stroke="#38bdf8" stroke-width="3" />
  </g>

  <!-- Coming Soon Headline -->
  <text x="400" y="445" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">COMING SOON</text>

  <!-- Price & Status -->
  <text x="400" y="490" font-family="'Montserrat', sans-serif" font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle">Rp 349.000</text>
  <text x="400" y="525" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">WINDBREAKER JACKET SERIES</text>

  <!-- Pre-order button mockup -->
  <g transform="translate(400, 570)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#38bdf8" filter="url(#neonGlow)" />
    <text x="0" y="5" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#030712" text-anchor="middle" letter-spacing="2">SIAPKAN WISHLIST</text>
  </g>
</svg>
