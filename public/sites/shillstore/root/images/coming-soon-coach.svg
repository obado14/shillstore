<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlowCoach" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#181512" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b0a09" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cardGradCoach" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26211c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#171412" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="gridCoach" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlowCoach)" />
  <rect width="800" height="800" fill="url(#gridCoach)" />

  <!-- Streetwear Watermark Accent -->
  <text x="50%" y="140" font-family="'Montserrat', 'Impact', sans-serif" font-size="76" font-weight="900" fill="#f59e0b" fill-opacity="0.06" text-anchor="middle" letter-spacing="16">COACH JACKET</text>
  <text x="50%" y="710" font-family="'Montserrat', 'Impact', sans-serif" font-size="64" font-weight="900" fill="#ffffff" fill-opacity="0.04" text-anchor="middle" letter-spacing="20">SHILL STORE</text>

  <!-- Outer Tech Frame -->
  <rect x="50" y="50" width="700" height="700" rx="32" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="12 8" />
  <circle cx="50" cy="50" r="4" fill="#f59e0b" fill-opacity="0.6" />
  <circle cx="750" cy="50" r="4" fill="#f59e0b" fill-opacity="0.6" />
  <circle cx="50" cy="750" r="4" fill="#f59e0b" fill-opacity="0.6" />
  <circle cx="750" cy="750" r="4" fill="#f59e0b" fill-opacity="0.6" />

  <!-- Central Card Container -->
  <rect x="140" y="190" width="520" height="420" rx="24" fill="url(#cardGradCoach)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))" />

  <!-- Top Badge -->
  <g transform="translate(400, 235)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#d97706" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1" />
    <text x="0" y="5" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="3">SHILL • STREETWEAR</text>
  </g>

  <!-- Stylized Coach Jacket Wireframe Icon (Pointed collar, snap buttons) -->
  <g transform="translate(400, 330) scale(1.15)">
    <!-- Folded Pointed Collar -->
    <path d="M-28,-40 L0,-24 L28,-40 L16,-48 L-16,-48 Z" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Collar to Shoulders & Body -->
    <path d="M-28,-40 L-58,-25 L-76,30 L-50,38 L-42,-5 L-42,45 L42,45 L42,-5 L50,38 L76,30 L58,-25 L28,-40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Center Placket -->
    <line x1="0" y1="-24" x2="0" y2="45" stroke="#ffffff" stroke-width="2" />
    <!-- Snap Buttons -->
    <circle cx="0" cy="-14" r="3" fill="#fbbf24" />
    <circle cx="0" cy="2" r="3" fill="#fbbf24" />
    <circle cx="0" cy="18" r="3" fill="#fbbf24" />
    <circle cx="0" cy="34" r="3" fill="#fbbf24" />
  </g>

  <!-- Coming Soon Headline -->
  <text x="400" y="445" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">COMING SOON</text>

  <!-- Model Title -->
  <text x="400" y="485" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" fill="url(#amberGrad)" text-anchor="middle" letter-spacing="6">COACH JACKET</text>

  <!-- Subtitle Specs -->
  <text x="400" y="525" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">SNAP BUTTON • BREATHABLE LINING • CASUAL</text>

  <!-- Bottom Release Pill -->
  <g transform="translate(400, 565)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#d97706" />
    <text x="0" y="4" font-family="'Montserrat', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">DROP SOON • 2026</text>
  </g>
</svg>
