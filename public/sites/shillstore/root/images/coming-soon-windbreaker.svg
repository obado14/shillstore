<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0b1320" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06090e" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlow)" />
  <rect width="800" height="800" fill="url(#grid)" />

  <!-- Streetwear Watermark Accent -->
  <text x="50%" y="140" font-family="'Montserrat', 'Impact', sans-serif" font-size="72" font-weight="900" fill="#38bdf8" fill-opacity="0.06" text-anchor="middle" letter-spacing="16">WINDBREAKER</text>
  <text x="50%" y="710" font-family="'Montserrat', 'Impact', sans-serif" font-size="64" font-weight="900" fill="#ffffff" fill-opacity="0.04" text-anchor="middle" letter-spacing="20">SHILL STORE</text>

  <!-- Outer Tech Frame -->
  <rect x="50" y="50" width="700" height="700" rx="32" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="12 8" />
  <circle cx="50" cy="50" r="4" fill="#38bdf8" fill-opacity="0.6" />
  <circle cx="750" cy="50" r="4" fill="#38bdf8" fill-opacity="0.6" />
  <circle cx="50" cy="750" r="4" fill="#38bdf8" fill-opacity="0.6" />
  <circle cx="750" cy="750" r="4" fill="#38bdf8" fill-opacity="0.6" />

  <!-- Central Card Container -->
  <rect x="140" y="190" width="520" height="420" rx="24" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))" />

  <!-- Top Badge -->
  <g transform="translate(400, 235)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="5" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="3">SHILL • OUTERWEAR</text>
  </g>

  <!-- Stylized Jacket Wireframe Icon -->
  <g transform="translate(400, 330) scale(1.15)">
    <!-- Hood -->
    <path d="M-22,-45 C-22,-65 22,-65 22,-45 C15,-40 -15,-40 -22,-45 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Collar & Shoulders -->
    <path d="M-22,-45 L-55,-25 L-75,30 L-50,38 L-42,-5 L-42,45 L42,45 L42,-5 L50,38 L75,30 L55,-25 L22,-45" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Center Zip -->
    <line x1="0" y1="-42" x2="0" y2="45" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <!-- Pocket Zips -->
    <line x1="-28" y1="12" x2="-14" y2="24" stroke="#38bdf8" stroke-width="2" />
    <line x1="28" y1="12" x2="14" y2="24" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Coming Soon Headline -->
  <text x="400" y="445" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">COMING SOON</text>

  <!-- Model Title -->
  <text x="400" y="485" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" fill="url(#cyanGrad)" text-anchor="middle" letter-spacing="6">WINDBREAKER JACKET</text>

  <!-- Subtitle Specs -->
  <text x="400" y="525" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">WATER-RESISTANT • TASLAN MIKRO • UNISEX</text>

  <!-- Bottom Release Pill -->
  <g transform="translate(400, 565)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#0284c7" />
    <text x="0" y="4" font-family="'Montserrat', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">DROP SOON • 2026</text>
  </g>
</svg>
