<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlowVarsity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#180e10" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0a0506" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="cardGradVarsity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#281519" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#160a0d" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="gridVarsity" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ef4444" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlowVarsity)" />
  <rect width="800" height="800" fill="url(#gridVarsity)" />

  <!-- Streetwear Watermark Accent -->
  <text x="50%" y="140" font-family="'Montserrat', 'Impact', sans-serif" font-size="76" font-weight="900" fill="#ef4444" fill-opacity="0.06" text-anchor="middle" letter-spacing="16">VARSITY JACKET</text>
  <text x="50%" y="710" font-family="'Montserrat', 'Impact', sans-serif" font-size="64" font-weight="900" fill="#ffffff" fill-opacity="0.04" text-anchor="middle" letter-spacing="20">SHILL STORE</text>

  <!-- Outer Tech Frame -->
  <rect x="50" y="50" width="700" height="700" rx="32" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="12 8" />
  <circle cx="50" cy="50" r="4" fill="#ef4444" fill-opacity="0.6" />
  <circle cx="750" cy="50" r="4" fill="#ef4444" fill-opacity="0.6" />
  <circle cx="50" cy="750" r="4" fill="#ef4444" fill-opacity="0.6" />
  <circle cx="750" cy="750" r="4" fill="#ef4444" fill-opacity="0.6" />

  <!-- Central Card Container -->
  <rect x="140" y="190" width="520" height="420" rx="24" fill="url(#cardGradVarsity)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))" />

  <!-- Top Badge -->
  <g transform="translate(400, 235)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#b91c1c" fill-opacity="0.25" stroke="#f87171" stroke-width="1" />
    <text x="0" y="5" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#f87171" text-anchor="middle" letter-spacing="3">SHILL • HERITAGE</text>
  </g>

  <!-- Stylized Varsity Jacket Wireframe Icon (Striped collar, contrast sleeves, 'S' patch) -->
  <g transform="translate(400, 330) scale(1.15)">
    <!-- Striped Baseball Ribbed Collar -->
    <path d="M-22,-44 C-22,-54 22,-54 22,-44 L16,-38 C16,-46 -16,-46 -16,-38 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <!-- Sleeves & Body -->
    <path d="M-16,-38 L-55,-24 L-75,28 L-52,36 L-42,-4 L-42,45 L42,45 L42,-4 L52,36 L75,28 L55,-24 L16,-38" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Contrast Sleeves line -->
    <path d="M-16,-38 L-42,-4 M16,-38 L42,-4" stroke="#ef4444" stroke-width="2.5" />
    <!-- Striped Cuffs & Hem -->
    <line x1="-75" y1="28" x2="-52" y2="36" stroke="#ef4444" stroke-width="3" />
    <line x1="75" y1="28" x2="52" y2="36" stroke="#ef4444" stroke-width="3" />
    <line x1="-42" y1="43" x2="42" y2="43" stroke="#ef4444" stroke-width="3" />
    <!-- Center Snap Placket -->
    <line x1="0" y1="-38" x2="0" y2="42" stroke="#ffffff" stroke-width="2" />
    <!-- Snap Buttons -->
    <circle cx="0" cy="-22" r="2.5" fill="#ef4444" />
    <circle cx="0" cy="-6" r="2.5" fill="#ef4444" />
    <circle cx="0" cy="10" r="2.5" fill="#ef4444" />
    <circle cx="0" cy="26" r="2.5" fill="#ef4444" />
    <!-- Varsity 'S' Patch on Chest -->
    <text x="-22" y="2" font-family="'Georgia', serif" font-size="20" font-weight="900" fill="#f87171" text-anchor="middle">S</text>
  </g>

  <!-- Coming Soon Headline -->
  <text x="400" y="445" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">COMING SOON</text>

  <!-- Model Title -->
  <text x="400" y="485" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" fill="url(#redGrad)" text-anchor="middle" letter-spacing="6">VARSITY JACKET</text>

  <!-- Subtitle Specs -->
  <text x="400" y="525" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">CHENILLE PATCH • FLEECE & LEATHER • RETRO</text>

  <!-- Bottom Release Pill -->
  <g transform="translate(400, 565)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#b91c1c" />
    <text x="0" y="4" font-family="'Montserrat', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">DROP SOON • 2026</text>
  </g>
</svg>
